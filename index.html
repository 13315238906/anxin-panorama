<html lang="zh-CN" data-page-node-id="XwFYNW9p435UUnCFNHHKKc">
<head data-page-node-id="WbEk4JI4mVGW8sXxHKP0AA">
<meta charset="utf-8" data-page-node-id="F0YnI2C4WeHjf3SugELnII">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" data-page-node-id="Go1hiGuZ32Ft4UxF9LZ8Mj">
<title>河北安新中学 · 校园全景漫游</title>
<link rel="stylesheet" href="vendor/pannellum.css" data-page-node-id="1wbuOiJAx1AdnYx3Exnhz6">
<style>
  :root{
    --bg:#0f1115; --panel:#171a20; --panel-2:#1e222a;
    --line:rgba(255,255,255,.09); --line-2:rgba(255,255,255,.16);
    --txt:#e9ecf1; --txt-2:#9aa3b0; --accent:#4a9eff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--txt);
    font-family:"Microsoft YaHei","PingFang SC",system-ui,-apple-system,sans-serif;
    overflow:hidden;
  }
  #app{display:flex; height:100%; width:100%}

  /* ---------- 侧边栏 ---------- */
  #sidebar{
    width:264px; flex:0 0 264px; background:var(--panel);
    border-right:1px solid var(--line);
    display:flex; flex-direction:column; transition:transform .28s ease;
    z-index:20;
  }
  .brand{padding:20px 18px 14px; border-bottom:1px solid var(--line)}
  .brand h1{font-size:16px; font-weight:600; letter-spacing:.3px}
  .brand p{font-size:12px; color:var(--txt-2); margin-top:5px; line-height:1.5}
  .list-label{
    padding:14px 18px 8px; font-size:11px; color:var(--txt-2);
    letter-spacing:1.2px; text-transform:uppercase;
  }
  #sceneList{flex:1; overflow-y:auto; padding:0 10px 10px}
  .scene-item{
    width:100%; display:flex; align-items:center; gap:10px;
    padding:11px 12px; margin-bottom:4px; border-radius:9px;
    background:transparent; border:1px solid transparent;
    color:var(--txt); font-size:14px; font-family:inherit;
    cursor:pointer; text-align:left; transition:background .15s, border-color .15s;
  }
  .scene-item:hover{background:var(--panel-2)}
  .scene-item.active{background:rgba(74,158,255,.14); border-color:rgba(74,158,255,.4)}
  .scene-item .idx{
    width:22px; height:22px; flex:0 0 22px; border-radius:50%;
    background:rgba(255,255,255,.07); color:var(--txt-2);
    font-size:11px; display:flex; align-items:center; justify-content:center;
  }
  .scene-item.active .idx{background:var(--accent); color:#fff}
  .scene-item .nm{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .scene-item .cnt{font-size:11px; color:var(--txt-2)}
  .side-foot{
    padding:12px 18px; border-top:1px solid var(--line);
    font-size:11px; color:var(--txt-2); line-height:1.6;
  }
  .side-foot a{color:var(--accent); text-decoration:none}

  /* ---------- 主舞台 ---------- */
  #stage{position:relative; flex:1; min-width:0; background:#000}
  #panorama{width:100%; height:100%}
  #topbar{
    position:absolute; top:0; left:0; right:0; z-index:10;
    display:flex; align-items:center; gap:12px;
    padding:14px 16px; pointer-events:none;
    background:linear-gradient(180deg, rgba(0,0,0,.55), rgba(0,0,0,0));
  }
  #topbar > *{pointer-events:auto}
  #menuBtn{
    display:none; width:38px; height:38px; border-radius:9px;
    background:rgba(0,0,0,.5); border:1px solid var(--line-2);
    cursor:pointer; padding:9px;
  }
  #menuBtn svg{width:100%; height:100%; stroke:var(--txt); fill:none; stroke-width:2}
  #nowTitle{
    font-size:15px; font-weight:600; text-shadow:0 1px 6px rgba(0,0,0,.7);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  #hint{
    position:absolute; bottom:16px; left:50%; transform:translateX(-50%);
    z-index:10; padding:8px 16px; border-radius:20px;
    background:rgba(0,0,0,.55); border:1px solid var(--line-2);
    font-size:12px; color:#cfd6df; backdrop-filter:blur(6px);
    animation:fadeout .6s ease 6s forwards;
  }
  @keyframes fadeout{to{opacity:0; visibility:hidden}}
  #scrim{
    display:none; position:absolute; inset:0; z-index:15;
    background:rgba(0,0,0,.45);
  }

  #err{
    position:absolute; inset:0; display:none; flex-direction:column;
    align-items:center; justify-content:center; gap:10px; padding:32px;
    text-align:center; color:var(--txt-2); font-size:14px; line-height:1.7;
  }
  #err code{
    background:var(--panel-2); padding:3px 8px; border-radius:5px;
    color:var(--txt); font-size:13px;
  }

  /* ---------- 图钉热点（anxin-pin） ---------- */
  /* Pannellum 带 cssClass 的热点，真实类名是 "pnlm-hotspot-base anxin-pin"（没有 pnlm-hotspot）。
     定位由 JS 用 offsetWidth/offsetHeight 把盒子【居中】到目标点，
     所以 div 必须保留真实尺寸（26x26），图钉的尖落在盒子中心 = 目标点。 */
  .pnlm-hotspot-base.anxin-pin{
    width:26px !important; height:26px !important; margin:0 !important;
    background:transparent !important; background-image:none !important;
    cursor:pointer; overflow:visible;
  }
  .pnlm-hotspot-base.anxin-pin::before{
    content:""; position:absolute; left:2px; top:-13.5px;
    width:22px; height:22px;
    background:var(--accent); border:2px solid #fff;
    border-radius:50% 50% 50% 0; transform:rotate(-45deg);
    box-shadow:0 3px 8px rgba(0,0,0,.5); box-sizing:border-box;
  }
  .pnlm-hotspot-base.anxin-pin::after{
    content:""; position:absolute; left:9px; top:-6px;
    width:7px; height:7px; background:#fff; border-radius:50%; z-index:1;
  }
  .pnlm-hotspot-base.anxin-pin:hover::before{ filter:brightness(1.15) }

  /* 返回鸟瞰的红色图钉 */
  .pnlm-hotspot-base.anxin-pin-back{
    width:26px !important; height:26px !important; margin:0 !important;
    background:transparent !important; background-image:none !important;
    cursor:pointer; overflow:visible;
  }
  .pnlm-hotspot-base.anxin-pin-back::before{
    content:""; position:absolute; left:2px; top:-13.5px;
    width:22px; height:22px;
    background:#ff5a5a; border:2px solid #fff;
    border-radius:50% 50% 50% 0; transform:rotate(-45deg);
    box-shadow:0 3px 8px rgba(0,0,0,.5); box-sizing:border-box;
  }
  .pnlm-hotspot-base.anxin-pin-back::after{
    content:""; position:absolute; left:9px; top:-6px;
    width:7px; height:7px; background:#fff; border-radius:50%; z-index:1;
  }
  .pnlm-hotspot-base.anxin-pin-back:hover::before{ filter:brightness(1.1) }

  /* ---------- 移动端 ---------- */
  @media (max-width:768px){
    #sidebar{
      position:absolute; inset:0 auto 0 0; transform:translateX(-100%);
      box-shadow:0 0 40px rgba(0,0,0,.5);
    }
    #sidebar.open{transform:translateX(0)}
    #scrim.show{display:block}
    #menuBtn{display:block}
  }
</style>
</head>

<script src="vendor/pannellum.js"></script>
<script>
(function () {
  var viewer = null;

  function el(id) { return document.getElementById(id); }

  function buildList(cfg) {
    var box = el('sceneList');
    box.innerHTML = '';
    var ids = Object.keys(cfg.scenes);
    ids.forEach(function (id, i) {
      var sc = cfg.scenes[id];
      var exits = (sc.hotSpots || []).filter(function (h) { return h.type === 'scene'; }).length;
      var btn = document.createElement('button');
      btn.className = 'scene-item';
      btn.dataset.id = id;
      btn.innerHTML =
        '<span class="idx">' + (i + 1) + '</span>' +
        '<span class="nm"></span>' +
        '<span class="cnt">' + exits + '</span>';
      btn.querySelector('.nm').textContent = sc.title || id;
      btn.addEventListener('click', function () {
        if (viewer) viewer.loadScene(id);
        closeSidebar();
      });
      box.appendChild(btn);
    });
  }

  function setActive(id) {
    document.querySelectorAll('.scene-item').forEach(function (n) {
      n.classList.toggle('active', n.dataset.id === id);
    });
    var cfg = window.__tour;
    if (cfg && cfg.scenes[id]) el('nowTitle').textContent = cfg.scenes[id].title || id;
  }

  function openSidebar() {
    el('sidebar').classList.add('open');
    el('scrim').classList.add('show');
  }
  function closeSidebar() {
    el('sidebar').classList.remove('open');
    el('scrim').classList.remove('show');
  }

  el('menuBtn').addEventListener('click', openSidebar);
  el('scrim').addEventListener('click', closeSidebar);

  fetch('tour.json', { cache: 'no-store' })
    .then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(function (cfg) {
      window.__tour = cfg;
      buildList(cfg);
      viewer = pannellum.viewer('panorama', cfg);
      viewer.on('scenechange', setActive);
      setActive(cfg.default.firstScene);
    })
    .catch(function (e) {
      console.error(e);
      el('err').style.display = 'flex';
    });
})();
</script>
